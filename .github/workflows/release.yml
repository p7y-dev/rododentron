name: release

# v* tagre felteszi a ghcr.io/p7y-dev/rododentron:<verzió> image-et.
# A tag (v nélkül) egyezzen a VERSION fájllal.
# A költözés előtt a régi Docker Hub repóba kiadott verziókat változatlanul átmásolja
# (azonos digest), az újakat buildeli.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/p7y-dev/rododentron
  LEGACY_IMAGE: docker.io/csakaszamok/rododentron

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag és VERSION egyezése
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::A tag ($GITHUB_REF_NAME) nem egyezik a VERSION fájllal ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Már kiadott verzió nem írható felül
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION már létezik; emeld a VERSION-t"
            exit 1
          fi

      - name: Régi Docker Hub image átmásolása
        id: legacy
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$LEGACY_IMAGE:$VERSION" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:$VERSION" "$LEGACY_IMAGE:$VERSION"
            docker buildx imagetools inspect "$IMAGE:$VERSION"
            echo "copied=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build és push
        if: steps.legacy.outputs.copied != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/p7y-dev/rododentron
